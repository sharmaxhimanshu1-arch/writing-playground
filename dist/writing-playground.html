<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
<style>
/*
 * Layout concept: a writer's desk. A wide, quiet sheet in the middle; an idea tray on the left;
 * an editor's margin on the right, marked up in blue pencil (the traditional copy-editor's color).
 */
:root {
  --bg: #e9ecf0;
  --sheet: #fcfcfb;
  --panel: #f5f6f8;
  --raised: #ffffff;
  --ink: #1b1f27;
  --muted: #5b6474;
  --faint: #8a93a3;
  --line: #d6dbe2;
  --accent: #2c56c9;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9fa;
  --select: rgba(44, 86, 201, 0.22);

  --good: #1f7a4a;
  --warn: #a35f00;
  --bad: #c0342b;
  --info: #56657f;
  --good-tint: rgba(31, 122, 74, 0.12);
  --warn-tint: rgba(214, 138, 0, 0.17);
  --bad-tint: rgba(192, 52, 43, 0.13);
  --good-soft: #e3f2e9;
  --warn-soft: #fbefd9;
  --bad-soft: #f9e2df;
  --info-soft: #e8ecf2;

  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-editor: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-md: 0.9375rem;
  --text-lg: 1.125rem;
  --editor-size: 1.1875rem;
  --editor-leading: 1.75;

  --radius: 8px;
  --left-w: 300px;
  --right-w: 400px;
  --shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 8px 24px rgba(20, 30, 50, 0.06);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216;
    --sheet: #171a1f;
    --panel: #13161a;
    --raised: #1c2026;
    --ink: #e5e8ee;
    --muted: #9ba4b4;
    --faint: #6d7686;
    --line: #2a3039;
    --accent: #8ea8ff;
    --accent-ink: #0d1324;
    --accent-soft: #1d2847;
    --select: rgba(142, 168, 255, 0.28);
    --good: #5fcb8f;
    --warn: #f0b04a;
    --bad: #ff7d73;
    --info: #9aaac6;
    --good-tint: rgba(95, 203, 143, 0.16);
    --warn-tint: rgba(240, 176, 74, 0.18);
    --bad-tint: rgba(255, 125, 115, 0.17);
    --good-soft: #15291f;
    --warn-soft: #2d2412;
    --bad-soft: #301a19;
    --info-soft: #1c222c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #101216;
  --sheet: #171a1f;
  --panel: #13161a;
  --raised: #1c2026;
  --ink: #e5e8ee;
  --muted: #9ba4b4;
  --faint: #6d7686;
  --line: #2a3039;
  --accent: #8ea8ff;
  --accent-ink: #0d1324;
  --accent-soft: #1d2847;
  --select: rgba(142, 168, 255, 0.28);
  --good: #5fcb8f;
  --warn: #f0b04a;
  --bad: #ff7d73;
  --info: #9aaac6;
  --good-tint: rgba(95, 203, 143, 0.16);
  --warn-tint: rgba(240, 176, 74, 0.18);
  --bad-tint: rgba(255, 125, 115, 0.17);
  --good-soft: #15291f;
  --warn-soft: #2d2412;
  --bad-soft: #301a19;
  --info-soft: #1c222c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

[hidden] { display: none !important; }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

code, kbd {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--info-soft);
  padding: 0.05em 0.35em;
  border-radius: 4px;
}

/* ---------- App frame ---------- */

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.brand { display: flex; align-items: center; gap: 8px; flex: none; }

.brand-mark {
  width: 22px; height: 22px;
  fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

.brand-name {
  font-family: var(--font-editor);
  font-style: italic;
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.genre-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  flex: 1;
}
.genre-tabs::-webkit-scrollbar { display: none; }

.genre-tab {
  flex: none;
  border: 1px solid transparent;
  background: none;
  padding: 6px 12px;
  border-radius: 999px;
  color: var(--muted);
  font-size: var(--text-sm);
  font-weight: 700;
  white-space: nowrap;
}
.genre-tab:hover { color: var(--ink); background: var(--raised); }
.genre-tab[aria-pressed="true"] {
  color: var(--accent-ink);
  background: var(--accent);
}

.top-actions { display: flex; gap: 4px; flex: none; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--raised);
  color: var(--muted);
  border-radius: var(--radius);
  padding: 6px 9px;
  font-size: var(--text-sm);
}
.icon-btn:hover { color: var(--ink); }
.icon-btn[aria-expanded="true"], .icon-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn svg .fill { fill: currentColor; stroke: none; }

.layout {
  display: grid;
  grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.layout.no-left { grid-template-columns: minmax(0, 1fr) var(--right-w); }
.layout.no-right { grid-template-columns: var(--left-w) minmax(0, 1fr); }
.layout.no-left.no-right { grid-template-columns: minmax(0, 1fr); }
.layout.no-left .panel-left, .layout.no-right .panel-right { display: none; }

/* ---------- Panels ---------- */

.panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.panel-left { border-right: 1px solid var(--line); }
.panel-right { border-left: 1px solid var(--line); }

.panel-tabs {
  display: flex;
  gap: 2px;
  padding: 8px 12px 0;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.panel-tabs button {
  border: 0;
  background: none;
  padding: 8px 10px 9px;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.panel-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.tab-score {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.tab-score:empty { display: none; }

.panel-body {
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 0;
  flex: 1;
}

.section { display: flex; flex-direction: column; gap: 10px; }
.section + .section { border-top: 1px solid var(--line); padding-top: 18px; }

.eyebrow {
  font-size: var(--text-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
  margin: 0;
}

.panel h3 {
  margin: 0;
  font-size: var(--text-md);
  font-weight: 700;
  text-wrap: balance;
}

.panel p { margin: 0; }

.muted { color: var(--muted); }
.small { font-size: var(--text-sm); }

.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--radius);
  padding: 6px 11px;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--ink);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.btn-quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 6px; }
.btn-danger:hover { border-color: var(--bad); color: var(--bad); }

/* Idea cards */

.idea-card {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.idea-text {
  font-family: var(--font-editor);
  font-size: 1.125rem;
  line-height: 1.45;
  text-wrap: pretty;
}
.slot {
  display: inline;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 4px;
  padding: 1px 4px;
  font-style: italic;
  cursor: pointer;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.slot:hover { text-decoration: underline; }

.sprint-clock {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.field { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); }
.field input {
  width: 90px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--raised);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* Drafts */

.draft-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.draft-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius);
  padding: 8px 6px 8px 10px;
  border: 1px solid transparent;
}
.draft-item:hover { background: var(--raised); }
.draft-item.current { background: var(--raised); border-color: var(--line); }
.draft-open { border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.draft-title { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.draft-meta { display: block; font-size: var(--text-xs); color: var(--muted); }

/* ---------- Checks ---------- */

.score-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px;
  align-items: center;
}
.score-num {
  font-family: var(--font-editor);
  font-size: 3rem;
  line-height: 1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.score-num small { font-size: 1rem; color: var(--faint); font-weight: 400; }
.meter {
  height: 8px;
  border-radius: 999px;
  background: var(--info-soft);
  overflow: hidden;
  display: flex;
}
.meter span { display: block; height: 100%; }
.meter .m-pass { background: var(--good); }
.meter .m-warn { background: var(--warn); }
.meter .m-fail { background: var(--bad); }
.score-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--text-xs); color: var(--muted); margin-top: 6px; }
.score-legend b { color: var(--ink); font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px 4px 8px;
  background: var(--raised);
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--muted);
}
.filter .swatch { width: 14px; height: 6px; border-radius: 2px; }
.filter[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
.filter .count { font-family: var(--font-mono); font-weight: 500; }
.swatch-good { background: var(--good); }
.swatch-warn { background: var(--warn); }
.swatch-bad { background: var(--bad); }
.swatch-info { background: var(--info); }

.spotlight-bar .btn { color: var(--accent); white-space: nowrap; }
.spotlight-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--text-sm);
  font-weight: 700;
}

.check-group { display: flex; flex-direction: column; gap: 6px; }
.check {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--raised);
}
.check.spot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.check-head {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
}
.check-title { font-weight: 700; display: block; }
.check-summary { display: block; font-size: var(--text-sm); color: var(--muted); }
.check-count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); padding-top: 2px; }
.check-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; font-size: var(--text-sm); }
.check-why { color: var(--ink); line-height: 1.5; }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.hit {
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: var(--text-sm);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hit:hover { border-color: var(--accent); }
.hit-text { font-family: var(--font-editor); font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-note { color: var(--muted); font-size: var(--text-xs); }
.hit-good .hit-text { color: var(--good); }
.hit-warn .hit-text { color: var(--warn); }
.hit-bad .hit-text { color: var(--bad); }

.badge {
  display: inline-block;
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 7px;
  border-radius: 4px;
  min-width: 74px;
  text-align: center;
  margin-top: 1px;
}
.badge-pass { background: var(--good-soft); color: var(--good); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-fail { background: var(--bad-soft); color: var(--bad); }
.badge-info, .badge-na { background: var(--info-soft); color: var(--info); }

/* ---------- Frameworks ---------- */

.fw {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--raised);
}
.fw.active { border-color: var(--accent); }
.fw-head {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fw-name { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fw-tag { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; }
.fw-summary { font-size: var(--text-sm); color: var(--muted); }
.fw-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px; }
.beats { margin: 0; padding: 0; list-style: none; counter-reset: beat; display: flex; flex-direction: column; gap: 8px; }
.beat {
  counter-increment: beat;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  font-size: var(--text-sm);
}
.beat::before {
  content: counter(beat);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  color: var(--muted);
}
.beat.done::before { background: var(--good); border-color: var(--good); color: var(--sheet); }
.beat.started::before { border-color: var(--warn); color: var(--warn); }
.beat b { display: block; }
.beat span { color: var(--muted); }
.fw-example {
  font-family: var(--font-editor);
  font-size: 0.95rem;
  white-space: pre-wrap;
  background: var(--panel);
  border-radius: 6px;
  padding: 10px 12px;
  max-height: 220px;
  overflow: auto;
  margin: 0;
  border: 1px solid var(--line);
}

/* ---------- Learn ---------- */

.lesson { border-bottom: 1px solid var(--line); }
.lesson summary {
  cursor: pointer;
  padding: 10px 0;
  font-weight: 700;
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.lesson summary::-webkit-details-marker { display: none; }
.lesson summary::after { content: "+"; color: var(--faint); font-family: var(--font-mono); }
.lesson[open] summary::after { content: "–"; }
.lesson p { padding: 0 0 12px; color: var(--muted); font-size: var(--text-sm); }
.plain-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); }
.glossary { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; font-size: var(--text-sm); }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0 0 4px; color: var(--muted); }
.legend { display: grid; gap: 8px; font-size: var(--text-sm); }
.legend-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.lead { font-family: var(--font-editor); font-size: 1.0625rem; line-height: 1.55; }

/* ---------- Desk and editor ---------- */

.desk {
  overflow-y: auto;
  padding: 32px 24px 80px;
  min-width: 0;
  scroll-padding-block: 120px;
}

.sheet {
  max-width: 46rem;
  margin: 0 auto;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 36px 56px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: calc(100% - 20px);
}
.sheet.wide { max-width: 72rem; }

.sheet-head { display: flex; flex-direction: column; gap: 10px; }

.doc-title {
  border: 0;
  background: none;
  font-family: var(--font-editor);
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.2;
  padding: 0;
  outline: none;
  width: 100%;
}
.doc-title::placeholder { color: var(--faint); }

.sheet-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: var(--text-xs);
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: none;
}
.chip-select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 11px) 52%, calc(100% - 7px) 52%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.chip-select:hover, .chip-btn:hover { color: var(--accent); border-color: var(--accent); }
.chip-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

.editor-wrap { position: relative; flex: 1; }

.backdrop, #editor {
  font-family: var(--font-editor);
  font-size: var(--editor-size);
  line-height: var(--editor-leading);
  font-weight: 400;
  letter-spacing: normal;
  word-spacing: normal;
  font-kerning: normal;
  font-variant-ligatures: common-ligatures;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  tab-size: 4;
  margin: 0;
  padding: 0 0 2em;
  border: 0;
  text-align: left;
}

.backdrop {
  position: relative;
  color: var(--ink);
  min-height: 55vh;
  pointer-events: none;
}

#editor {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  overflow: hidden;
  background: transparent;
  color: transparent;
  caret-color: var(--ink);
  outline: none;
}
#editor::placeholder { color: var(--faint); }
#editor::selection { background: var(--select); color: transparent; }

.backdrop .ln-h { color: var(--accent); }
.backdrop .ln-note { color: var(--faint); }
.backdrop .cue { color: var(--info); background: var(--info-soft); border-radius: 3px; }

.backdrop .m { pointer-events: auto; border-radius: 2px; text-decoration-skip-ink: none; text-underline-offset: 0.22em; }
.backdrop .m-good { background: var(--good-tint); text-decoration: underline solid var(--good); text-decoration-thickness: 2px; }
.backdrop .m-warn { background: var(--warn-tint); text-decoration: underline wavy var(--warn); text-decoration-thickness: 1.5px; }
.backdrop .m-bad { background: var(--bad-tint); text-decoration: underline wavy var(--bad); text-decoration-thickness: 1.5px; }
.backdrop .m-info { text-decoration: underline dotted var(--info); text-decoration-thickness: 2px; }
.backdrop .m.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash {
  0% { box-shadow: 0 0 0 3px var(--accent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.sheet-foot { margin: 0; font-size: var(--text-xs); color: var(--faint); border-top: 1px solid var(--line); padding-top: 12px; }

/* ---------- Status bar, tooltip, toast ---------- */

.statusbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 7px 16px;
  padding-bottom: calc(7px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--panel);
  font-size: var(--text-xs);
  color: var(--muted);
  min-width: 0;
  overflow: hidden;
}
.stat { white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-weight: 700; }
.stat-goal { display: inline-flex; align-items: center; gap: 8px; }
.goal-track { width: 80px; height: 6px; border-radius: 999px; background: var(--info-soft); overflow: hidden; display: inline-block; }
.goal-fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.stat-sprint { color: var(--accent); font-family: var(--font-mono); }
.cursor-note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.save-state { color: var(--faint); }

.tooltip {
  position: fixed;
  z-index: 40;
  max-width: 320px;
  background: var(--raised);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: var(--text-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.tip-row { display: flex; flex-direction: column; gap: 2px; }
.tip-title { font-weight: 700; font-size: var(--text-xs); display: flex; align-items: center; gap: 6px; }
.tip-title .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--sheet);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: var(--text-sm);
  font-weight: 700;
  z-index: 50;
  box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
  text-align: center;
}

.scrim { display: none; }

/* ---------- Focus mode ---------- */

.app.focus .panel { display: none; }
.app.focus .layout { grid-template-columns: minmax(0, 1fr); }
.app.focus .sheet-foot { display: none; }

/* ---------- Narrow screens: panels become drawers ---------- */

@media (max-width: 1180px) {
  :root { --left-w: 260px; --right-w: 360px; }
  .sheet { padding: 28px 36px 24px; }
}

@media (max-width: 960px) {
  .layout, .layout.no-left, .layout.no-right { grid-template-columns: minmax(0, 1fr); }
  .panel {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 30;
    width: min(400px, 92vw);
    box-shadow: var(--shadow);
    transition: transform 0.22s ease;
  }
  .panel-left { left: 0; transform: translateX(-102%); }
  .panel-right { right: 0; transform: translateX(102%); }
  .layout.show-left .panel-left, .layout.show-right .panel-right { transform: none; }
  .layout.no-left .panel-left, .layout.no-right .panel-right { display: flex; }
  .scrim { display: block; position: absolute; inset: 0; background: rgba(10, 14, 22, 0.35); z-index: 25; }
  .btn-label { display: none; }
  .brand-name { display: none; }
}

@media (max-width: 640px) {
  .topbar { gap: 10px; padding-inline: 16px; }
  .desk { padding: 16px 16px 60px; }
  .sheet { padding: 20px 18px 18px; border-radius: 8px; }
  .doc-title { font-size: 1.5rem; }
  :root { --editor-size: 1.0625rem; }
  #statTime, #statGrade, .save-state { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Fixes ---------- */

.fix-card {
  position: fixed;
  z-index: 45;
  width: min(320px, calc(100vw - 32px));
  background: var(--raised);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  padding: 12px;
  font-size: var(--text-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fix-card p { margin: 0; }

.hit {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
}
.hit:hover { border-color: var(--accent); }
.hit-main {
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.hit-fixes { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.btn-small { padding: 3px 8px; font-size: var(--text-xs); }

/* ---------- Progress ---------- */

.progress-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--text-sm); color: var(--muted); }
.progress-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.progress-chart { width: 100%; height: auto; display: block; overflow: visible; }
.progress-chart .bar { fill: var(--accent); }
.progress-chart .bar-empty { fill: var(--line); }
.progress-chart .bar-hit { fill: transparent; cursor: default; }
.progress-chart g:hover .bar { fill: var(--ink); }
.progress-chart .axis-label { fill: var(--faint); font-size: 9px; font-family: var(--font-ui); }

/* ---------- Practice ---------- */

.drill-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.drill-open {
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.drill-open:hover { border-color: var(--accent); }
.drill.current .drill-open { border-color: var(--accent); }
.drill-title { font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.drill-task { font-size: var(--text-sm); color: var(--muted); }
.tick { color: var(--good); font-weight: 700; }
.drill-status { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.drill-status .badge { min-width: 0; }
.drill-done { color: var(--good); font-weight: 700; align-self: center; }

/* ---------- Coach ---------- */

.coach-error { color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 8px 10px; font-size: var(--text-sm); }
.coach-busy { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); color: var(--accent); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
.coach-review, .coach-options { display: flex; flex-direction: column; gap: 10px; }
.coach-card {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: var(--text-sm);
  align-items: flex-start;
}
.coach-card .badge { min-width: 0; }
.coach-rewrite {
  font-family: var(--font-editor);
  font-size: 1rem;
  line-height: 1.5;
  background: var(--good-soft);
  border-radius: 6px;
  padding: 8px 10px;
  white-space: pre-wrap;
  align-self: stretch;
}
.quote-btn {
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  font-family: var(--font-editor);
  font-style: italic;
  font-size: 1rem;
  color: var(--ink);
  text-decoration: underline dotted var(--faint);
  text-underline-offset: 3px;
}
.quote-btn:hover { color: var(--accent); }
.quote-inline { font-family: var(--font-editor); font-style: italic; }
.good-list li::marker { color: var(--good); }
.coach-ideas { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; font-size: var(--text-sm); }
.coach-ideas li { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.coach-chat { display: flex; flex-direction: column; gap: 8px; }
.coach-chat:empty { display: none; }
.bubble { border-radius: 10px; padding: 8px 12px; font-size: var(--text-sm); white-space: pre-wrap; max-width: 92%; }
.bubble-user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.bubble-assistant { align-self: flex-start; background: var(--raised); border: 1px solid var(--line); }
.coach-ask { display: flex; flex-direction: column; gap: 8px; }
.coach-ask textarea {
  width: 100%;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--raised);
  padding: 8px 10px;
  font-size: var(--text-sm);
}
.beat-jump {
  border: 0;
  background: none;
  padding: 0;
  font-weight: 700;
  color: var(--accent);
  text-align: left;
  display: block;
}
.beat-jump:hover { text-decoration: underline; }
.panel-tabs { overflow-x: auto; scrollbar-width: none; }
.panel-tabs::-webkit-scrollbar { display: none; }
.panel-tabs button { flex: none; }

/* ---------- Tour ---------- */

.tour {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(440px, calc(100vw - 32px));
  background: var(--raised);
  border: 1px solid var(--accent);
  box-shadow: var(--shadow);
  border-radius: 12px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tour h3 { margin: 0; font-family: var(--font-editor); font-size: 1.375rem; font-weight: 600; text-wrap: balance; }
.tour p { margin: 0; }
.tour-target { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 8px; position: relative; z-index: 5; }

/* ---------- Modal ---------- */

.modal {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(10, 14, 22, 0.45);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal-card {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  width: min(760px, 100%);
  max-height: calc(100% - 32px);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-family: var(--font-editor); font-size: 1.25rem; font-weight: 600; }
.modal-body { padding: 16px 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; }
.diff {
  margin: 0;
  font-family: var(--font-editor);
  font-size: 1rem;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}
ins { text-decoration: none; background: var(--good-tint); color: var(--good); border-radius: 2px; }
del { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--bad); background: var(--bad-tint); border-radius: 2px; }

/* ---------- History ---------- */

.version-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.version {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--raised);
}
.version-meta { display: flex; flex-direction: column; font-size: var(--text-sm); min-width: 0; }
.version-meta span { color: var(--muted); font-size: var(--text-xs); }
.score-spark { width: 100%; height: auto; display: block; overflow: visible; }
.score-spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.score-spark .grid { stroke: var(--line); stroke-dasharray: 3 3; }
.score-spark .pt { fill: var(--accent); }
.score-spark .end { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.score-spark .bar-hit { fill: transparent; }

.challenge.done { border-color: var(--good); }

/* ---------- Compact top bar ---------- */

.genre-select {
  display: none;
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: var(--text-sm);
  font-weight: 700;
  min-width: 0;
  max-width: 220px;
}
.topbar.compact .genre-tabs { visibility: hidden; flex: 0 0 0; width: 0; overflow: hidden; }
.topbar.compact .genre-select { display: block; flex: 1 1 auto; margin-right: auto; }

/* ---------- Learning path ---------- */

.path-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.path-level { font-family: var(--font-editor); font-size: 1.375rem; font-weight: 600; }
.path-bar { display: flex; gap: 3px; }
.path-bar span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.path-bar span.done { background: var(--good); }
.path-bar span.next { background: var(--accent); }
.path-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.path-steps li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: var(--text-sm); }
.path-steps li.next { background: var(--raised); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px; margin-inline: -8px; }
.path-num {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: var(--text-xs);
  border: 1px solid var(--line); color: var(--muted);
}
.path-steps li.done .path-num { background: var(--good); border-color: var(--good); color: var(--sheet); }
.path-steps li.done .path-text b { color: var(--muted); font-weight: 400; }
.path-steps li.next .path-num { border-color: var(--accent); color: var(--accent); }
.path-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 2px; }

/* ---------- Check controls ---------- */

.toggle { display: flex; gap: 8px; align-items: flex-start; font-size: var(--text-sm); cursor: pointer; }
.toggle input { margin-top: 3px; accent-color: var(--accent); }
.muted-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--text-sm); }
.muted-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); }

/* ---------- Display settings ---------- */

.backdrop, #editor { font-family: var(--font-page, var(--font-editor)); }
.display-form { display: flex; flex-direction: column; gap: 16px; }
.seg { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.seg legend { font-weight: 700; font-size: var(--text-sm); margin-bottom: 6px; padding: 0; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span {
  display: inline-block;
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: var(--text-sm);
  font-weight: 700;
}
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.shortcuts { margin: 0; display: grid; gap: 10px; }
.shortcuts div { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.shortcuts dd { margin: 0; color: var(--muted); font-size: var(--text-sm); }
@media (max-width: 520px) { .shortcuts div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* ---------- Study ---------- */

.study-beat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.study-label { display: flex; gap: 8px; align-items: center; }
.study-text { margin: 0; font-family: var(--font-editor); font-size: 1rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: break-word; }

/* ---------- Outline ---------- */

.outline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; counter-reset: para; }
.outline button {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 5px 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: var(--text-sm);
}
.outline button:hover { background: var(--raised); }
.outline li:not(.ol-head) button { font-family: var(--font-editor); font-size: 0.95rem; }
.outline .ol-head button { color: var(--accent); font-weight: 700; padding-top: 8px; }
.ol-words { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint); flex: none; padding-top: 2px; }

/* ---------- Rhythm ---------- */

.rhythm { border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); padding: 8px 12px; }
.rhythm summary { cursor: pointer; font-weight: 700; font-size: var(--text-sm); display: flex; justify-content: space-between; gap: 8px; }
.rhythm[open] summary { margin-bottom: 8px; }
.rhythm p { margin-top: 6px; }
.rhythm-chart { width: 100%; height: auto; display: block; }
.rhythm-chart .ok { fill: var(--accent); }
.rhythm-chart .over { fill: var(--warn); }
.rhythm-chart .limit { stroke: var(--faint); stroke-dasharray: 3 3; }
.rhythm-chart .bar-hit { fill: transparent; cursor: pointer; }
.rhythm-chart g:hover rect, .rhythm-chart .bar-hit:hover { fill: rgba(127, 127, 127, 0.12); }

/* ---------- Drafts: search and storage ---------- */

.search {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--raised);
  padding: 7px 10px;
  font-size: var(--text-sm);
}
.storage { display: flex; flex-direction: column; gap: 6px; }
.storage-track { width: 100%; }
.goal-fill.warn { background: var(--warn); }

/* ---------- Plan ---------- */

.plan { border: 1px solid var(--accent); border-radius: var(--radius); background: var(--raised); padding: 10px 12px; }
.plan summary { cursor: pointer; font-size: var(--text-sm); }
.plan[open] summary { margin-bottom: 8px; }
.plan > p { margin-bottom: 10px; }
.plan-fields { display: flex; flex-direction: column; gap: 10px; }
.plan-field { display: flex; flex-direction: column; gap: 4px; font-size: var(--text-sm); }
.plan-field textarea {
  width: 100%;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  padding: 6px 8px;
  font-family: var(--font-editor);
  font-size: 0.95rem;
}

/* ---------- Habits, improved, preview ---------- */

.habits { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; }
.habits li { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.habits p { margin: 0; }
.lean { display: flex; flex-wrap: wrap; gap: 6px; }
.lean .chip b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.improved { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: var(--text-sm); }
.improved.fixed li::marker { color: var(--good); }
.improved.worse li::marker { color: var(--bad); }
.improved.still li::marker { color: var(--warn); }
.preview { font-family: var(--font-editor); font-size: 1.0625rem; line-height: 1.7; display: flex; flex-direction: column; gap: 12px; max-width: 40rem; }
.preview h2 { font-size: 1.75rem; margin: 0; line-height: 1.2; }
.preview h3 { font-size: 1.2rem; margin: 8px 0 0; }
.preview p { margin: 0; white-space: pre-wrap; }
.preview .small { font-family: var(--font-ui); }
.preview-cue { font-family: var(--font-ui); font-size: var(--text-sm); color: var(--info); }

/* ---------- Page toolbar ---------- */

.sheet { container-type: inline-size; }
.sheet-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.tool-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.tool-select {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background-color: var(--raised);
  color: var(--ink);
  font-size: var(--text-xs);
  font-weight: 700;
  padding: 5px 26px 5px 11px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
  max-width: 100%;
}
.tool-pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--raised);
  font-size: var(--text-xs);
  font-weight: 700;
  padding: 5px 11px;
  color: var(--ink);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool-select:hover, .tool-pill:hover { border-color: var(--accent); color: var(--accent); }
.tool-pill-label { color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.625rem; margin-right: 2px; }
.tool-icons { gap: 2px; }
.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid transparent;
  background: none;
  border-radius: 8px;
  padding: 5px 8px;
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 700;
}
.tool-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tool-btn:hover { color: var(--ink); background: var(--panel); }
.tool-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
@container (max-width: 540px) {
  .tool-label, .tool-pill-label { display: none; }
  .tool-pill { max-width: 170px; }
  .tool-select { max-width: 150px; }
  .tool-btn { padding: 6px; }
}

/* ---------- Blank-page starter ---------- */

.starter {
  position: absolute;
  z-index: 3;
  top: 2.6em;
  left: 0;
  right: 0;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow);
}
.starter-title { margin: 0; font-family: var(--font-editor); font-size: 1.375rem; font-weight: 600; }
.starter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.starter-grid button {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 10px;
  padding: 12px 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.starter-grid button:hover { border-color: var(--accent); }
.starter-grid b { font-size: var(--text-md); }
.starter-grid span { font-size: var(--text-sm); color: var(--muted); }
.starter-skip { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; font-size: var(--text-sm); }
.starter-skip:hover { text-decoration: underline; }
@container (max-width: 520px) { .starter-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Checks: folded sections ---------- */

.fold summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-sm);
  font-weight: 700;
  padding: 6px 0;
}
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "+"; margin-left: auto; color: var(--faint); font-family: var(--font-mono); }
.fold[open] summary::after { content: "–"; }
.fold[open] summary { margin-bottom: 8px; }
.fold .badge { min-width: 0; }
.waiting-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); }
.all-good { margin: 0; padding: 12px 14px; border-radius: var(--radius); background: var(--good-soft); color: var(--good); font-weight: 700; font-size: var(--text-sm); }
.score-none { font-family: var(--font-ui); font-size: 1.125rem; font-weight: 700; color: var(--muted); letter-spacing: 0; }

/* Following-the-rule marks stay quiet so the problems stand out. */
.backdrop .m-good { background: none; text-decoration: underline solid var(--good); text-decoration-thickness: 1.5px; }

.sheet-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; }

</style>
</head>

<script>
// ---- js/core/text.js
/*
 * Text analysis core.
 *
 * Turns a raw draft into a context object that every check reads from.
 * Offsets always point into the original text so marks line up with the editor.
 *
 * Draft conventions understood by the parser:
 *   ## Heading      section / framework beat (not analysed as prose)
 *   > note          writer's note or hint (ignored by checks)
 *   [B-ROLL: ...]   cue / stage direction (ignored as prose, counted as a cue)
 */
(function (WP) {
  'use strict';

  const ABBREVIATIONS = new Set([
    'mr', 'mrs', 'ms', 'dr', 'prof', 'sr', 'jr', 'st', 'vs', 'etc', 'e.g', 'i.e',
    'approx', 'dept', 'est', 'fig', 'inc', 'ltd', 'no', 'vol', 'mt', 'ft', 'u.s',
  ]);

  const WORD_RE = /[\p{L}\p{N}][\p{L}\p{N}\p{M}'’-]*/gu;

  function blankOut(chars, start, end) {
    for (let i = start; i < end; i++) if (chars[i] !== '\n') chars[i] = ' ';
  }

  function parse(text, opts) {
    opts = opts || {};
    const chars = text.split('');
    const lines = [];
    const headings = [];
    const cues = [];

    let pos = 0;
    for (const raw of text.split('\n')) {
      const start = pos;
      const end = pos + raw.length;
      let kind = 'prose';
      if (/^\s*$/.test(raw)) kind = 'blank';
      else if (/^\s*#{1,6}\s/.test(raw)) kind = 'heading';
      else if (/^\s*>/.test(raw)) kind = 'note';
      const line = { start, end, text: raw, kind, index: lines.length };
      lines.push(line);
      if (kind === 'heading' || kind === 'note') blankOut(chars, start, end);
      if (kind === 'heading') {
        const m = raw.match(/^\s*(#{1,6})\s+(.*)$/);
        headings.push({ start, end, level: m[1].length, title: m[2].trim(), line: line.index });
      }
      pos = end + 1;
    }

    // [cues] inside prose lines
    const cueRe = /\[[^\]\n]*\]/g;
    let m;
    while ((m = cueRe.exec(text))) {
      const line = lineAtOffset(lines, m.index);
      if (line && line.kind === 'prose') {
        cues.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
        blankOut(chars, m.index, m.index + m[0].length);
      }
    }

    const masked = chars.join('');

    // A prose line that is empty once cues are removed is a cue-only line.
    for (const line of lines) {
      if (line.kind === 'prose' && !/\S/.test(masked.slice(line.start, line.end))) line.kind = 'cue';
    }

    // Paragraphs: runs of prose lines.
    const paragraphs = [];
    let cur = null;
    for (const line of lines) {
      if (line.kind === 'prose') {
        if (!cur) cur = { start: line.start, end: line.end, lines: [] };
        cur.end = line.end;
        cur.lines.push(line);
      } else if (cur) {
        paragraphs.push(cur);
        cur = null;
      }
    }
    if (cur) paragraphs.push(cur);

    const sentences = [];
    const words = [];
    paragraphs.forEach((p, pi) => {
      p.index = pi;
      p.text = masked.slice(p.start, p.end);
      p.sentences = [];
      splitSentences(masked, p.start, p.end, (s, e) => {
        const sentence = { start: s, end: e, text: masked.slice(s, e), paragraph: pi, index: sentences.length, words: [] };
        WORD_RE.lastIndex = 0;
        let wm;
        while ((wm = WORD_RE.exec(sentence.text))) {
          const clean = wm[0].replace(/['’-]+$/, '');
          const w = {
            start: s + wm.index,
            end: s + wm.index + clean.length,
            text: clean,
            lower: clean.toLowerCase().replace(/’/g, "'"),
            sentence: sentence.index,
            paragraph: pi,
            index: words.length,
          };
          sentence.words.push(w);
          words.push(w);
        }
        if (sentence.words.length) {
          sentences.push(sentence);
          p.sentences.push(sentence);
        }
      });
      p.words = words.filter((w) => w.paragraph === pi);
    });

    let syllableTotal = 0;
    for (const w of words) {
      w.syllables = syllables(w.text);
      syllableTotal += w.syllables;
    }

    return {
      text,
      masked,
      lines,
      headings,
      cues,
      paragraphs,
      sentences,
      words,
      wordCount: words.length,
      syllableTotal,
      framework: opts.framework || null,
      genre: opts.genre || null,
    };
  }

  function splitSentences(masked, from, to, emit) {
    let s = from;
    const push = (a, b) => {
      while (a < b && /\s/.test(masked[a])) a++;
      while (b > a && /\s/.test(masked[b - 1])) b--;
      if (b > a && /[\p{L}\p{N}]/u.test(masked.slice(a, b))) emit(a, b);
    };
    for (let i = from; i < to; i++) {
      const c = masked[i];
      if (c === '\n') {
        push(s, i);
        s = i + 1;
        continue;
      }
      if (c === '.' || c === '!' || c === '?' || c === '…') {
        let j = i + 1;
        while (j < to && /[.!?…"'”’)\]]/.test(masked[j])) j++;
        if (j >= to || /\s/.test(masked[j])) {
          if (c === '.') {
            const before = masked.slice(s, i).match(/([\p{L}.]+)$/u);
            if (before && ABBREVIATIONS.has(before[1].toLowerCase())) {
              i = j - 1;
              continue;
            }
          }
          push(s, j);
          s = j;
        }
        i = j - 1;
      }
    }
    push(s, to);
  }

  function lineAtOffset(lines, offset) {
    let lo = 0;
    let hi = lines.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const l = lines[mid];
      if (offset < l.start) hi = mid - 1;
      else if (offset > l.end) lo = mid + 1;
      else return l;
    }
    return null;
  }

  const SYLLABLE_OVERRIDES = {
    the: 1, every: 2, everything: 3, everyone: 3, different: 3, family: 3, evening: 2,
    business: 2, chocolate: 3, interesting: 3, beautiful: 3, poem: 2, poet: 2, poetry: 3,
    quiet: 2, science: 2, people: 2, little: 2, idea: 3, area: 3, real: 1, really: 2,
    being: 2, create: 2, fire: 1, hour: 1, our: 1, flower: 2, power: 2, heaven: 2,
    lion: 2, radio: 3, video: 3, piano: 3, violin: 3, ocean: 2, naive: 2, cruel: 2,
    fuel: 2, going: 2, doing: 2, seeing: 2, saying: 2, toward: 2, towards: 2,
    wednesday: 2, comfortable: 3, vegetable: 3, giant: 2, million: 2, onion: 2, union: 2, temperature: 4, usually: 4, actually: 4,
  };

  /** Estimated English syllable count for a single word. */
  function syllables(word) {
    let w = String(word).toLowerCase().replace(/’/g, "'").replace(/[^a-z']/g, '').replace(/'s$/, '').replace(/'/g, '');
    if (!w) return /\d/.test(word) ? String(word).replace(/\D/g, '').length : 0;
    if (SYLLABLE_OVERRIDES[w]) return SYLLABLE_OVERRIDES[w];
    if (w.length <= 3) return 1;
    w = w.replace(/(?:[^laeiouy]es|[^laeiouytd]ed|[^laeiouy]e)$/, '');
    w = w.replace(/^y/, '');
    const groups = w.match(/[aeiouy]{1,2}/g);
    let n = groups ? groups.length : 1;
    // Split vowel pairs that are usually two syllables (radiator, piano, radio).
    n += (w.match(/[^cgst]ia|[^cgstnl]io|eo(?!u)|(?<![qg])ua(?!r)/g) || []).length;
    if (/[^aeiou]le$/.test(word.toLowerCase()) && n === 0) n = 1;
    return Math.max(1, n);
  }

  function readability(ctx) {
    const s = Math.max(1, ctx.sentences.length);
    const w = Math.max(1, ctx.wordCount);
    const wps = w / s;
    const spw = ctx.syllableTotal / w;
    return {
      wordsPerSentence: wps,
      ease: 206.835 - 1.015 * wps - 84.6 * spw,
      grade: Math.max(0, 0.39 * wps + 11.8 * spw - 15.59),
    };
  }

  function escapeRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /** Build a case-insensitive whole-word regex from a list of phrases. */
  function phraseRegex(list) {
    const parts = list
      .slice()
      .sort((a, b) => b.length - a.length)
      .map((p) => escapeRe(p).replace(/\s+/g, '\\s+').replace(/'/g, "['’]"));
    return new RegExp('(?<![\\p{L}\\p{N}\'’])(?:' + parts.join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
  }

  /** Like phraseRegex, but single words also match -s, -es, -ed, -d and -ing forms. */
  function formsRegex(list) {
    const parts = list
      .slice()
      .sort((a, b) => b.length - a.length)
      .map((p) => escapeRe(p).replace(/\s+/g, '\\s+').replace(/'/g, "['’]") + (/\s/.test(p) ? '' : '(?:s|es|ed|d|ing)?'));
    return new RegExp('(?<![\\p{L}\\p{N}\'’])(?:' + parts.join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
  }

  /** All matches of a regex in the prose (masked) text. */
  function findAll(ctx, re, range) {
    const out = [];
    const src = range ? ctx.masked.slice(range.start, range.end) : ctx.masked;
    const base = range ? range.start : 0;
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(src))) {
      if (m[0].length === 0) {
        re.lastIndex++;
        continue;
      }
      out.push({ start: base + m.index, end: base + m.index + m[0].length, text: m[0], groups: m });
      if (!re.global) break;
    }
    return out;
  }

  function sentenceAt(ctx, offset) {
    return ctx.sentences.find((s) => offset >= s.start && offset <= s.end) || null;
  }

  /** Lines that carry prose (used by poetry and scripts). */
  function proseLines(ctx) {
    return ctx.lines.filter((l) => l.kind === 'prose').map((l) => {
      const maskedLine = ctx.masked.slice(l.start, l.end);
      const words = ctx.words.filter((w) => w.start >= l.start && w.end <= l.end);
      return Object.assign({}, l, { masked: maskedLine, words });
    });
  }

  /** Sections delimited by headings, with their prose word counts. */
  function sections(ctx) {
    const out = [];
    ctx.headings.forEach((h, i) => {
      const next = ctx.headings[i + 1];
      const start = h.end + 1;

    run(ctx) {

    title: 'Framework beats',
    group: 'Structure',

      const missing = beats.filter((b) => !b.section).map((b) => b.beat.name);
      const total = beats.length;
      return {
        status: filled === total ? 'pass' : filled >= total / 2 ? 'warn' : 'fail',
        summary: `${filled} of ${total} beats written` + (missing.length ? `. Missing headings: ${missing.join(', ')}.` : '.'),
        marks,
      };
    },
  });

  function run(checks, ctx, opts = {}) {
    const results = [];
    const force = new Set(opts.force || []);
    for (const c of checks) {
      const base = { id: c.id, title: c.title, group: c.group || 'Style', why: c.why };
      const min = force.has(c.id) ? Math.min(1, c.minWords ?? 20) : c.minWords ?? 20;
      if (ctx.wordCount < min) {
        results.push(Object.assign(base, { status: 'na', summary: `Starts checking after ${min} words.`, marks: [] }));
        continue;
      }
      let r;
      try {
        r = c.run(ctx);
      } catch (err) {
        console.error('Check failed:', c.id, err);
        r = { status: 'na', summary: 'This check hit an error and was skipped.', marks: [] };
      }
      if (!r) continue;
      r.marks = (r.marks || []).filter((m) => m.end > m.start);
      r.marks.forEach((m) => {
        m.checkId = c.id;
        m.checkTitle = c.title;
      });
      results.push(Object.assign(base, r));
    }
    const weights = { pass: 1, warn: 0.5, fail: 0 };
    const scored = results.filter((r) => r.status in weights);
    const score = scored.length ? Math.round((scored.reduce((a, r) => a + weights[r.status], 0) / scored.length) * 100) : null;

  }

/*
 * Small text diff for comparing draft versions: line-level LCS, then word-level
 * LCS inside lines that changed. Returns HTML with <ins> and <del>.
 */
(function (WP) {
  'use strict';

  function lcs(a, b) {
    const n = a.length;
    const m = b.length;
    if (n * m > 4e6) return a.map((v) => ({ t: '-', v })).concat(b.map((v) => ({ t: '+', v })));
    const w = m + 1;
    const dp = new Int32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    const ops = [];
    let i = 0;
    let j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) {
        ops.push({ t: '=', v: a[i] });
        i++;
        j++;
      } else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) ops.push({ t: '-', v: a[i++] });
      else ops.push({ t: '+', v: b[j++] });
    }
    while (i < n) ops.push({ t: '-', v: a[i++] });
    while (j < m) ops.push({ t: '+', v: b[j++] });
    return ops;
  }

  const words = (s) => s.match(/\s+|[^\s]+/g) || [];

  function wordDiff(a, b, esc) {
    return lcs(words(a), words(b)).map((o) => (o.t === '=' ? esc(o.v) : o.t === '-' ? `<del>${esc(o.v)}</del>` : `<ins>${esc(o.v)}</ins>`)).join('');
  }

  /** Diff of two texts as HTML, plus counts of words added and removed. */
  function diff(before, after, esc) {
    const ops = lcs(before.split('\n'), after.split('\n'));
    const out = [];
    let added = 0;
    let removed = 0;
    for (let k = 0; k < ops.length;) {
      if (ops[k].t === '=') {
        out.push(esc(ops[k].v));
        k++;
        continue;
      }
      const dels = [];
      const ins = [];
      while (k < ops.length && ops[k].t !== '=') (ops[k].t === '-' ? dels : ins).push(ops[k++].v);
      const pairs = Math.min(dels.length, ins.length);
      for (let p = 0; p < pairs; p++) {
        const w = lcs(words(dels[p]), words(ins[p]));
        w.forEach((o) => {
          if (/\S/.test(o.v)) {
            if (o.t === '+') added++;
            if (o.t === '-') removed++;
          }
        });
        out.push(wordDiff(dels[p], ins[p], esc));
      }
      dels.slice(pairs).forEach((l) => {
        removed += words(l).filter((x) => /\S/.test(x)).length;
        out.push(`<del>${esc(l)}</del>`);
      });
      ins.slice(pairs).forEach((l) => {
        added += words(l).filter((x) => /\S/.test(x)).length;
        out.push(`<ins>${esc(l)}</ins>`);
      });
    }
    return { html: out.join('\n'), added, removed };
  }

  WP.diff = diff;
})(window.WP = window.WP || {});

      run(ctx) {
        const b = blocks(classify(ctx), 'dialogue');
        if (!b.length) return { status: 'info', summary: 'No dialogue yet. Write a character name in CAPS, then their line below it.', marks: [] };
        const long = b.filter((x) => x.words > 50);
        return {
          status: long.length === 0 ? 'pass' : long.length === 1 ? 'warn' : 'fail',
          summary: long.length ? `${plural(long.length, 'speech', 'speeches')} over 50 words.` : `${plural(b.length, 'speech', 'speeches')}, all short.`,
          marks: long.map((x) => mark(x.lines[0], 'warn', `${x.words} words without a break. Who interrupts? What does the other person do?`)),
        };
      },
    },

      id: 'parentheticals',
      title: 'Few parentheticals',
      group: 'Dialogue',
      minWords: 30,
      why: 'A parenthetical like (angrily) tells the actor how to say a line. Use them rarely, only when the meaning would be unclear. If the line needs (angrily), the line itself is not angry enough.',
      run(ctx) {
        const lines = classify(ctx);
        const parens = lines.filter((l) => l.role === 'parenthetical');
        const speeches = blocks(lines, 'dialogue').length || 1;
        const marks = parens.filter((l) => /\(\s*\w+ly\s*\)/i.test(l.trimmed)).map((l) => mark(l, 'warn', 'An adverb parenthetical. Let the line and the actor carry the emotion.'));
        return {
          status: marks.length === 0 && parens.length <= speeches / 3 ? 'pass' : 'warn',
          summary: `${plural(parens.length, 'parenthetical')} across ${plural(speeches, 'speech', 'speeches')}.`,
          marks,
        };
      },
    },

      group: 'Dialogue',

      run(ctx) {
        const dialogue = classify(ctx).filter((l) => l.role === 'dialogue');
        const re = new RegExp("\\b(i(?:'m|’m| am) (?:so |really |very |just )?(?:" + lex.emotions.join('|') + ")|i feel (?:like )?(?:so |really )?\\w+|i love you|i hate you)\\b", 'gi');

        return {
          status: hits.length === 0 ? 'pass' : hits.length <= 1 ? 'warn' : 'fail',
          summary: hits.length ? `${plural(hits.length, 'on-the-nose line')}.` : 'Characters don’t announce their feelings.',

        return {
          status: 'info',
          summary: `≈ ${pages < 1 ? 'under 1 page' : pages.toFixed(1) + ' pages'} (≈ ${Math.max(1, Math.round(pages))} min on screen). ${dlg} dialogue lines, ${act} action lines.`,
          marks: [],
        };
      },
    },

// ---- js/genres/warmups.js
/*
 * Warm-up games: short, timed writing games with a hard constraint the editor
 * checks live. They work in any genre. Each game builds its checks from params
 * chosen when the game starts (for example, three random words).
 */
(function (WP) {
  'use strict';
  const T = WP.text;
  const { mark, plural, quote } = WP.checks;

  const RANDOM_WORDS = ['umbrella', 'lighthouse', 'pancake', 'telescope', 'grandmother', 'cactus', 'elevator', 'violin',
    'passport', 'goldfish', 'thunder', 'lipstick', 'helicopter', 'sandwich', 'compass', 'skateboard', 'volcano',
    'teacup', 'dentist', 'fireworks', 'ladder', 'wedding', 'snowman', 'library', 'zipper', 'parrot', 'bicycle'];

  const pickN = (arr, n) => arr.slice().sort(() => Math.random() - 0.5).slice(0, n);

  function exactWords(n) {
    return {
      id: 'game-length',
      title: `Exactly ${n} words`,
      group: 'Warm-up rules',
      minWords: 0,
      why: `The whole game is fitting a complete story into exactly ${n} words. Every word has to earn its place.`,
      run(ctx) {
        const c = ctx.wordCount;
        return {
          status: c === n ? 'pass' : 'fail',
          summary: c === n ? `${n} words exactly.` : c < n ? `${c} words: ${n - c} to go.` : `${c} words: cut ${c - n}.`,
          marks: [],
        };
      },
    };
  }

  const GAMES = [
    {
      id: 'six-word',
      title: 'Six-word story',
      minutes: 3,
      rules: 'Tell a complete story in exactly six words. The legend: “For sale: baby shoes, never worn.”',
      tip: 'Imply a before and an after. Let the reader fill the gap.',
      checks: () => [exactWords(6)],
    },
    {
      id: 'fifty',
      title: 'Fifty-word story',
      minutes: 5,
      rules: 'Write a complete story with a beginning, middle and end in exactly fifty words.',
      tip: 'Write long first, then cut. Counting is part of the fun.',
      checks: () => [exactWords(50)],
    },
    {
      id: 'lipogram',
      title: 'No letter E',
      minutes: 5,
      rules: 'Write at least 40 words without using the letter “e” once. It is the most common letter in English.',
      tip: 'Swap words: “the” → “a”, “he” → “that man”, “three” → “a trio of”.',
      checks: () => [
        {
          id: 'game-no-e',
          title: 'No letter E',
          group: 'Warm-up rules',
          minWords: 0,
          why: 'A lipogram leaves out one letter. Banning “e” forces you off your usual words and into fresh ones.',
          run(ctx) {
            const hits = T.findAll(ctx, /[eéèêë]/gi);
            const ok = hits.length === 0 && ctx.wordCount >= 40;
            return {
              status: ok ? 'pass' : 'fail',
              summary: hits.length ? `${plural(hits.length, 'E')} to remove.` : ctx.wordCount < 40 ? `No E so far. ${40 - ctx.wordCount} more words to go.` : 'Not a single E. Impressive.',
              marks: hits.map((h) => mark(h, 'bad', 'An E slipped in. Find another word.')),
            };
          },
        },
      ],
    },
    {
      id: 'three-words',
      title: 'Three random words',
      minutes: 5,
      rules: 'Write a short scene (at least 60 words) that uses all three of these words: {words}.',
      tip: 'Make the strangest word the most important one.',
      setup: () => ({ words: pickN(RANDOM_WORDS, 3) }),
      checks: (p) => [
        {
          id: 'game-words',
          title: 'Use all three words',
          group: 'Warm-up rules',
          minWords: 0,
          why: `Random words force connections you would never plan. Your words: ${p.words.join(', ')}.`,
          run(ctx) {
            const marks = [];
            const missing = [];
            for (const w of p.words) {
              const hits = T.findAll(ctx, new RegExp(`\\b${w}s?\\b`, 'gi'));
              if (hits.length) marks.push(mark(hits[0], 'good', `${quote(w)} used.`));
              else missing.push(w);
            }
            const ok = !missing.length && ctx.wordCount >= 60;
            return {
              status: ok ? 'pass' : 'fail',
              summary: missing.length ? `Still missing: ${missing.join(', ')}.` : ctx.wordCount < 60 ? `All three words in. ${60 - ctx.wordCount} more words to go.` : 'All three words, woven in.',
              marks,
            };
          },
        },
      ],
    },
    {
      id: 'abc',
      title: 'ABC sentences',
      minutes: 5,
      rules: 'Write five sentences. The first starts with A, the second with B, then C, D and E.',
      tip: 'Plan the story first, then bend each sentence to its letter.',
      checks: () => [
        {
          id: 'game-abc',
          title: 'A, B, C, D, E',
          group: 'Warm-up rules',
          minWords: 0,
          why: 'Constraints on sentence openings stop you starting every sentence with “I” or “The”.',
          run(ctx) {
            const letters = 'ABCDE';
            const marks = [];
            let good = 0;
            ctx.sentences.slice(0, 5).forEach((s, i) => {
              const w = s.words[0];
              if (w.text[0].toUpperCase() === letters[i]) {
                good++;
                marks.push(mark(w, 'good', `Sentence ${i + 1} starts with ${letters[i]}.`));
              } else marks.push(mark(w, 'bad', `Sentence ${i + 1} should start with ${letters[i]}.`));
            });
            return {
              status: good === 5 && ctx.sentences.length >= 5 ? 'pass' : 'fail',
              summary: `${good} of 5 sentences start with the right letter.`,
              marks,
            };
          },
        },
      ],
    },
    {
      id: 'no-crutches',
      title: 'No crutch words',
      minutes: 5,
      rules: 'Write at least 80 words without: very, really, just, thing, stuff, nice, good, bad, a lot.',
      tip: 'When you reach for a crutch word, ask: what exactly do I mean?',
      checks: () => [
        {
          id: 'game-crutches',
          title: 'Zero crutch words',
          group: 'Warm-up rules',
          minWords: 0,
          why: 'Crutch words are the ones you use instead of thinking of the precise word. Banning them for five minutes builds the habit.',
          run(ctx) {
            const hits = T.findAll(ctx, T.phraseRegex(['very', 'really', 'just', 'thing', 'things', 'stuff', 'nice', 'good', 'bad', 'a lot']));
            const ok = !hits.length && ctx.wordCount >= 80;
            return {
              status: ok ? 'pass' : 'fail',
              summary: hits.length ? `${plural(hits.length, 'crutch word')} to replace.` : ctx.wordCount < 80 ? `Clean so far. ${80 - ctx.wordCount} more words to go.` : 'Not one crutch word.',
              marks: hits.map((h) => mark(h, 'bad', `${quote(h.text)} is banned in this game. What exactly do you mean?`)),
            };
          },
        },
      ],
    },
    {
      id: 'five-senses',
      title: 'Five senses',
      minutes: 5,
      rules: 'Describe one place in five sentences, using all five senses: sight, sound, smell, taste and touch.',
      tip: 'Smell and taste are the ones beginners forget. Start with them.',
      checks: () => [
        {
          id: 'game-senses',
          title: 'All five senses',
          group: 'Warm-up rules',
          minWords: 0,
          why: 'Most writing only uses sight. Forcing all five makes a place feel real.',
          run(ctx) {
            const marks = [];
            const used = [];
            for (const [sense, words] of Object.entries(WP.lex.senses)) {
              const hits = T.findAll(ctx, T.formsRegex(words));
              if (hits.length) {
                used.push(sense);
                marks.push(mark(hits[0], 'good', `Sense of ${sense}.`));
              }
            }
            const missing = Object.keys(WP.lex.senses).filter((s) => !used.includes(s));
            return {
              status: !missing.length ? 'pass' : 'fail',
              summary: missing.length ? `Missing: ${missing.join(', ')}.` : 'All five senses.',
              marks,
            };
          },
        },
      ],
    },
    {
      id: 'dialogue-only',
      title: 'Dialogue only',
      minutes: 5,
      rules: 'Write a scene of at least eight lines told only through dialogue. Every line is something a character says, in quotation marks.',
      tip: 'Two people who want different things. Let the reader work out who is speaking.',
      checks: () => [
        {
          id: 'game-dialogue',
          title: 'Only dialogue',
          group: 'Warm-up rules',
          minWords: 0,
          why: 'Without narration, the words people say must carry character, conflict and setting.',
          run(ctx) {
            const lines = T.proseLines(ctx).filter((l) => l.words.length);
            const bad = lines.filter((l) => !/^\s*["“'‘]/.test(l.text) || !/["”'’][.!?]?\s*$/.test(l.text));
            return {
              status: lines.length >= 8 && !bad.length ? 'pass' : 'fail',
              summary: bad.length ? `${plural(bad.length, 'line')} not in quotation marks.` : lines.length < 8 ? `${lines.length} of 8 lines.` : `${lines.length} lines of pure dialogue.`,
              marks: bad.map((l) => mark(l, 'bad', 'Narration or a tag. Put it in a character’s mouth, in quotation marks.')),
            };
          },
        },
      ],
    },
  ];

  WP.warmups = {
    list: GAMES,
    get: (id) => GAMES.find((g) => g.id === id),
    rulesText(game, params) {
      return game.rules.replace('{words}', params && params.words ? params.words.join(', ') : '');
    },
  };
})(window.WP = window.WP || {});

/*
 * Highlighting editor.
 *
 * A transparent <textarea> sits on top of a "backdrop" div that renders the same text
 * with colored marks. The backdrop is in normal flow, so it sets the height; the textarea
 * stretches over it. Because both use identical font metrics and wrapping, every mark
 * lines up with the text the writer is typing.
 */
(function (WP) {
  'use strict';

  const PRIORITY = { bad: 4, warn: 3, good: 2, info: 1 };

  function esc(s) {
    return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  class Editor {
    constructor({ textarea, backdrop, scroller, onChange, onCaret, onHover }) {
      this.ta = textarea;
      this.bd = backdrop;
      this.scroller = scroller;
      this.onChange = onChange;
      this.onCaret = onCaret;
      this.onHover = onHover;
      this.marks = [];
      this.visibleLevels = { good: true, warn: true, bad: true, info: true };
      this.spotlight = null;
      this.prevText = this.ta.value;

      this.ta.addEventListener('input', () => this.handleInput());
      this.ta.addEventListener('scroll', () => {
        if (this.ta.scrollTop) this.ta.scrollTop = 0;
      });
      const caret = () => this.onCaret && this.onCaret(this.ta.selectionStart, this.ta.selectionEnd);
      this.ta.addEventListener('keyup', caret);
      this.ta.addEventListener('click', caret);
      this.ta.addEventListener('select', caret);
      this.ta.addEventListener('mousemove', (e) => this.handleHover(e));
      this.ta.addEventListener('mouseleave', () => this.onHover && this.onHover(null));
      this.ta.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          this.insert('\t');
        }
      });
      this.render();
    }

    get value() {
      return this.ta.value;
    }

    set value(v) {
      this.ta.value = v;
      this.prevText = v;
      this.marks = [];
      this.render();
    }

    /** Inserts text at the cursor, keeping native undo where the browser supports it. */
    insert(text, { selectInserted = false } = {}) {
      this.ta.focus();
      if (text === '' && this.ta.selectionStart === this.ta.selectionEnd) return;
      const start = this.ta.selectionStart;
      let ok = false;
      try {
        ok = text === '' ? document.execCommand('delete', false) : document.execCommand('insertText', false, text);
      } catch (e) {
        ok = false;
      }
      if (!ok) {
        this.ta.setRangeText(text, this.ta.selectionStart, this.ta.selectionEnd, 'end');
        this.handleInput();
      }
      if (selectInserted) this.ta.setSelectionRange(start, start + text.length);
    }

    handleInput() {
      const next = this.ta.value;
      this.shiftMarks(this.prevText, next);
      this.prevText = next;
      this.render({ caret: this.ta.selectionStart });
      this.keepCaretVisible();
      if (this.onChange) this.onChange(next);
    }

    /** Moves existing marks to follow an edit so highlights stay put while typing. */
    shiftMarks(prev, next) {
      if (!this.marks.length) return;
      let p = 0;
      const max = Math.min(prev.length, next.length);
      while (p < max && prev.charCodeAt(p) === next.charCodeAt(p)) p++;
      let s = 0;
      while (s < max - p && prev.charCodeAt(prev.length - 1 - s) === next.charCodeAt(next.length - 1 - s)) s++;

      const delta = next.length - prev.length;
      this.marks = this.marks.filter((m) => m.end <= p || m.start >= oldEnd).map((m) => {
        if (m.start >= oldEnd) return Object.assign({}, m, { start: m.start + delta, end: m.end + delta });

      this.visibleLevels = levels;
      this.spotlight = spotlight;
      this.render();
    }

    shownMarks() {
      return this.marks.filter((m) => this.visibleLevels[m.level] && (!this.spotlight || m.checkId === this.spotlight));
    }

    render(opts = {}) {
      const text = this.ta.value;
      const marks = this.shownMarks().slice().sort((a, b) => a.start - b.start);
      this.rendered = marks;
      const caret = opts.caret;
      const lines = text.split('\n');
      let pos = 0;
      let mi = 0;

      for (const line of lines) {
        const start = pos;
        const end = pos + line.length;
        let cls = '';
        if (/^\s*#{1,6}\s/.test(line)) cls = 'ln-h';
        else if (/^\s*>/.test(line)) cls = 'ln-note';

          while ((c = re.exec(line))) cues.push({ start: start + c.index, end: start + c.index + c[0].length });
        }

        const points = new Set([start, end]);
        lineMarks.forEach(({ m }) => {
          points.add(Math.max(start, m.start));
          points.add(Math.min(end, m.end));
        });
        cues.forEach((c) => {
          points.add(c.start);
          points.add(c.end);
        });
        if (caret != null && caret >= start && caret <= end) points.add(caret);
        const sorted = [...points].sort((a, b) => a - b);

        let html = '';
        for (let k = 0; k < sorted.length; k++) {
          const a = sorted[k];

          for (const { m, i } of lineMarks) {
            if (m.start <= a && m.end >= b) {
              ids.push(i);
              if (!best || PRIORITY[m.level] > PRIORITY[best.level]) best = m;
            }
          }
          const inCue = cues.some((c) => c.start <= a && c.end >= b);
          let piece = seg;
          if (best) piece = `<span class="m m-${best.level}" data-ids="${ids.join(',')}" data-start="${best.start}">${piece}</span>`;
          if (inCue) piece = `<span class="cue">${piece}</span>`;
          html += piece;
        }
        out.push(cls ? `<span class="${cls}">${html}</span>` : html);
        pos = end + 1;
      }
      // A trailing zero-width space keeps the height of a final empty line.
      this.bd.innerHTML = out.join('\n') + '\n​';

    /** Screen rectangle of a text offset, measured through the backdrop. */
    rectAt(offset) {
      this.render({ caret: offset });

    scrollToCaret() {

      if (r.bottom > box.bottom - pad) this.scroller.scrollTop += r.bottom - (box.bottom - pad);

      if (!this.onHover) return;

    }

    marksAt(offset) {
      return this.marks.filter((m) => offset >= m.start && offset <= m.end);
    }

    reveal(start, end) {

        if (probe) probe.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      if (this.onCaret) this.onCaret(start, end);
    }
  }
