name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (undefined names, unused code)
        run: npm run lint

      - name: Rule checks (samples, framework examples, drills, warm-ups)
        run: npm test

      - name: Built files are up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist sw.js; then
            echo "::error::dist/ or sw.js is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist sw.js
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/output/
          if-no-files-found: ignore
